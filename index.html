; }\n  details.dimt table { border-collapse:collapse; width:100%; margin:4px 0; } details.dimt td { padding:2px 4px; border-bottom:1px solid var(--line); vertical-align:top; } details.dimt td:last-child { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }\n  #tip { display:none; position:absolute; z-index:6; width:270px; background:rgba(255,255,255,.97); border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:12px; line-height:1.45; pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.18); }\n  #tip .k { color:#5b6570; margin-bottom:3px; }\n  .boost { display:inline-block; width:90px; height:9px; border-radius:5px; background:#e3e6ea; overflow:hidden; vertical-align:middle; } .boost i { display:block; height:100%; width:100%; background:linear-gradient(90deg,#ff7a18,#ffd23f); }\n  #toast { display:none; position:absolute; left:50%; top:74px; transform:translateX(-50%); background:rgba(31,35,40,.9); color:#fff; font-size:13px; font-weight:600; padding:7px 14px; border-radius:9px; pointer-events:none; z-index:5; }\n  #loading { position:absolute; inset:0; display:grid; place-items:center; font-size:15px; color:var(--muted); pointer-events:none; }\n  @media (max-width: 760px) { #legend { display:none; } #info { bottom:110px; max-height:30vh; } }\n"; document.head.appendChild(st); document.body.insertAdjacentHTML("afterbegin", "\n<div id=\"app\"></div>\n<div id=\"loading\">Building the track\u2026</div>\n<div id=\"top\" class=\"panel\">\n  <h1>Robot Race Track \u00b7 3D</h1>\n  <div id=\"btns\" style=\"display:flex;flex-wrap:wrap;gap:5px\"></div>\n</div>\n<div id=\"legend\" class=\"panel\">\n  <b>Wire colors</b><br>\n  <span class=\"sw\" style=\"background:#f2f2ee\"></span>+12V (white; 2nd/3rd: <span class=\"sw\" style=\"background:#f48fb1;width:12px;margin:0 2px\"></span><span class=\"sw\" style=\"background:#b39ddb;width:12px;margin:0\"></span>)<br>\n  <span class=\"sw\" style=\"background:#141414\"></span>GND / 0V (black; 2nd/3rd: <span class=\"sw\" style=\"background:#68707b;width:12px;margin:0 2px\"></span><span class=\"sw\" style=\"background:#1c2f6b;width:12px;margin:0\"></span>)<br>\n  <span class=\"sw\" style=\"background:#d32f2f\"></span>+6V / +5V regulated (red)<br>\n  <span class=\"sw\" style=\"background:#6d4c41\"></span>servo GND (brown)<br>\n  <span class=\"sw\" style=\"background:#ff8f00\"></span>servo signal (orange)<br>\n  <span class=\"sw\" style=\"background:#f4c20d\"></span>sensor signal (yellow)<br>\n  <span class=\"sw\" style=\"background:#2ea043\"></span>control signal (green)<br>\n  <span class=\"sw\" style=\"background:#1e66d0\"></span>limit switch (blue)<br>\n  <span class=\"sw\" style=\"background:#9e9e9e\"></span>120V AC cord (gray jacket)<br>\n  <span class=\"mut\">Wires hop over each other where they cross. A wire that meets another of the same kind takes a second shade (lighter, or cyan / teal / coral), so each one can be followed.</span>\n  <b style=\"display:block;margin-top:6px\">Rotation stripes</b>\n  Every turning shaft has barber-pole stripes, and every gear and pulley has a white dot, so you can see it spin and which way.\n</div>\n<div id=\"info\" class=\"panel\"></div>\n<div id=\"ctrl\" class=\"panel\">\n  <div class=\"row\">\n    <button id=\"play\" class=\"on\">Pause</button>\n    <label>Speed <input id=\"speed\" type=\"range\" min=\"0.1\" max=\"3\" step=\"0.1\" value=\"1\"></label>\n    <button id=\"follow\" class=\"tg\" title=\"The camera rides with the car; you can still orbit, pan and zoom as far as you like (F)\">Follow car</button>\n    <button id=\"drive\" class=\"tg\" title=\"Steer the car yourself with W A S D or the arrow keys\">Drive it (WASD)</button>\n    <button id=\"xray\" class=\"tg\">See-through track</button>\n    <button id=\"bear\" class=\"tg\" title=\"Light up every bearing; point at one to see its type and sizes\">Bearings</button>\n    <button id=\"pivot\" class=\"tg\" title=\"Show the point the camera looks at and orbits round\">Orbit pivot</button>\n    <button id=\"tourBtn\">Start tour</button>\n    <button id=\"orbitBtn\" class=\"tg\" title=\"The camera glides slowly round the table, rising and falling, inside the room. Click the view to stop it\">Cinematic orbit</button><label title=\"How fast the orbit goes round\">Orbit speed <input id=\"orbitSpeed\" type=\"range\" min=\"0.2\" max=\"3\" step=\"0.1\" value=\"1\"></label>\n    <span class=\"mut\" title=\"Cars driving round the track by themselves\">Cars: <b id=\"carN\">1</b></span><button id=\"carAdd\" title=\"Put another car on the track. Cars keep a gap on open road, and each mechanism takes one car at a time\">+ Car</button><button id=\"carDel\" title=\"Take the last added car off again\">\u2212 Car</button>\n  </div>\n  <div class=\"row mut\" id=\"driveHint\" style=\"display:none\"><span>Driving: <b>W</b>/<b>S</b> forward/back \u00b7 <b>A</b>/<b>D</b> steer \u00b7 <b>Space</b> hop, again in the air for a double jump \u00b7 <b>left Shift</b> boost \u00b7 in the air <b>W</b>/<b>S</b> tip the nose down/up and <b>A</b>/<b>D</b> turn \u00b7 <b>R</b> reset \u00b7 <b>Q</b> flip upright</span>\n    <span class=\"boost\" title=\"Boost tank\"><i id=\"boostFill\"></i></span>\n    <button id=\"resetBtn\" title=\"Lift the car back onto the road where it last stood (R)\">Reset car</button>\n    <button id=\"flipBtn\" title=\"Turn the car the right way up where it is (Q)\">Flip upright</button>\n    <button id=\"chaseBtn\" class=\"tg\" title=\"The camera moves by itself to show what is coming: behind the car on open road, side-on at the axes and platforms, outside the spiral, high over the conveyors\u2026 Drag to look round, scroll to zoom\">Chase camera</button>\n    <button id=\"unlBoost\" class=\"tg\" title=\"The boost tank never runs out\">Unlimited boost</button>\n    <button id=\"autoReset\" class=\"tg\" title=\"On: the car is put back on the road by itself after it falls off. Off: it stays where it fell until you press Reset car\">Auto reset</button></div>\n  <div class=\"row\">\n    <span class=\"mut\">Show:</span>\n    <button class=\"tg on\" data-ui=\"menu\">Menu</button>\n    <button class=\"tg\" data-ui=\"info\">Info</button>\n    <button class=\"tg\" data-ui=\"legend\">Wire key</button>\n    <button class=\"tg on\" data-ui=\"parts\">Part labels</button>\n    <button class=\"tg\" data-ui=\"names\">Place names</button>\n    <button class=\"tg\" data-ui=\"status\">Status</button>\n    <button id=\"railsBtn\" class=\"tg on\" title=\"Click to step through: raised rails \u2192 flush red strips on the road (nothing to bump over) \u2192 no rails at all \u2192 raised again\">Guard rails</button>\n    <button id=\"decor\" class=\"tg on\" title=\"Hide or show the scenery (Sears Tower, bridge tender houses). You can also click one piece of scenery to hide just that one\">Scenery</button>\n    <button id=\"artBtn\" class=\"tg on\" title=\"The Chicago room: murals on the walls, the river floor, the sky ceiling and the tall mahogany table. Click to switch it all off and get the plain workshop floor back\">Artistic</button>\n    <button id=\"lockBtn\" class=\"tg on\" title=\"Keep the camera inside the room: it cannot pass through the walls, the ceiling or the floor\">Stay in room</button>\n    <button id=\"fxBtn\" class=\"tg on\" title=\"Floor reflection, uplight glow and the finest shadows. Switch off for a faster picture\">Effects</button>\n    <button id=\"wireBtn\" class=\"tg on\" title=\"Show or hide all the wiring\">Wiring</button>\n    <button class=\"tg\" data-ui=\"dims\" title=\"Real sizes. Click to step through: off \u2192 only what the pointer is over \u2192 everything, everywhere \u2192 off\">Dimensions</button>\n    <button id=\"hideAll\" title=\"Hide every menu and label (press H to bring them back)\">Hide everything</button>\n  </div>\n</div>\n<div id=\"tour\" class=\"panel\" style=\"display:none\">\n  <button id=\"tPrev\" title=\"Previous stop (left arrow)\">\u00ab Back</button>\n  <button id=\"tPause\" title=\"Pause / resume (space)\">Pause</button>\n  <button id=\"tNext\" title=\"Next stop (right arrow)\">Skip \u00bb</button>\n  <span id=\"tourCap\"></span>\n  <label>Tour speed <input id=\"tSpeed\" type=\"range\" min=\"0.25\" max=\"4\" step=\"0.25\" value=\"1\"></label>\n  <button id=\"tEnd\">End tour</button>\n</div>\n <div id=\"toast\"></div><div id=\"tip\"></div>\n<button id=\"unhide\" title=\"Show the menus again (H)\">Show controls</button>\n"); }

const matCache = {};
function M(c, o = {}) { const k = c + "|" + JSON.stringify(o); return matCache[k] ||= new THREE.MeshStandardMaterial({ color: c, roughness: .65, metalness: .05, ...o }); }
const MET = c => M(c, { metalness: .6, roughness: .35 });
function mesh(geo, mat) { const m = new THREE.Mesh(geo, (mat && (mat.isMaterial || Array.isArray(mat))) ? mat : M(mat)); m.castShadow = true; m.receiveShadow = true; return m; }
const at = (o, x, y, z) => { o.position.set(x, y, z); return o; };
const box = (w, h, d, c) => mesh(new THREE.BoxGeometry(w, h, d), c);
function cylGeo(r, len, seg = 24, axis = "y") { const g = new THREE.CylinderGeometry(r, r, len, seg); if (axis === "x") g.rotateZ(-HP); else if (axis === "z") g.rotateX(HP); return g; }
const cyl = (r, len, c, axis = "y", seg = 24) => mesh(cylGeo(r, len, seg, axis), c);

// striped (barber pole) material used on everything that rotates
const texCache = {};
function stripeTex(c1, c2) {
  const k = c1 + c2; if (texCache[k]) return texCache[k];
  const cv = document.createElement("canvas"); cv.width = cv.height = 64; const x = cv.getContext("2d");
  x.fillStyle = c1; x.fillRect(0, 0, 64, 64); x.fillStyle = c2;
  for (let i = -3; i < 4; i++) { const o = i * 32; x.beginPath(); x.moveTo(o, 0); x.lineTo(o + 16, 0); x.lineTo(o + 80, 64); x.lineTo(o + 64, 64); x.closePath(); x.fill(); }
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return texCache[k] = t;
}
const smCache = {};
function stripeMat(c1 = "#ff6d00", c2 = "#ffffff") { const k = c1 + c2; return smCache[k] ||= new THREE.MeshStandardMaterial({ map: stripeTex(c1, c2), roughness: .45, metalness: .25 }); }
const SH = { motor: ["#ff6d00", "#ffffff"], drive: ["#1e88e5", "#ffffff"], cam: ["#8e24aa", "#ffe082"], axle: ["#e53935", "#ffffff"], idle: ["#43a047", "#ffffff"] };
// a plain steel shaft. One coloured line and one white line run along it, and a coloured band marks each end, so you can see it turn and which way.
// The marks are paint: they are part of the shaft's own surface, with nothing standing off it
const shaftMats = {};
function shaftMat(cols, f) { const k = cols[0] + cols[1] + f; if (shaftMats[k]) return shaftMats[k]; const cv = document.createElement("canvas"); cv.width = 256; cv.height = 256; const x = cv.getContext("2d"), w = 256 * .8 / TAU;
  x.fillStyle = "#c4cad1"; x.fillRect(0, 0, 256, 256); x.fillStyle = cols[0]; for (const y0 of [f * .5, 1 - f * 1.5]) x.fillRect(0, y0 * 256, 128, f * 256); x.fillRect(-w / 2, 0, w, 256); x.fillRect(256 - w / 2, 0, w, 256); x.fillStyle = cols[1]; x.fillRect(128 - w / 2, 0, w, 256);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = THREE.RepeatWrapping; t.anisotropy = 4; return shaftMats[k] = new THREE.MeshStandardMaterial({ map: t, metalness: .35, roughness: .38 }); }
function shaft(r, len, axis = "z", cols = SH.motor) {

  s.moveTo(pts[0][0], pts[0][1]); pts.slice(1).forEach(p => s.lineTo(p[0], p[1])); s.closePath();
  const n = 5, w = (Ll - .95) / n;

    if (i % 2 === 0) { h.moveTo(x0 + .07, -.08); h.lineTo(x0 + w / 2, top(x0 + w / 2) - .13); h.lineTo(x0 + w - .07, -.08); }
    else { h.moveTo(x0 + .07, top(x0 + .07) - .13); h.lineTo(x0 + w - .07, top(x0 + w - .07) - .13); h.lineTo(x0 + w / 2, -.08); }

}
